services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    network_mode: host
    environment:
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - /mnt/ssd/AppData/home-assistant:/config
      - /run/dbus:/run/dbus:ro
