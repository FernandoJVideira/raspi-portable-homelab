services:
  arcane:
    image: ghcr.io/getarcaneapp/manager:latest
    container_name: arcane
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/ssd/AppData/arcane:/app/data
    networks:
      cloudflare:
    environment:
      - APP_URL=${APP_URL:?set APP_URL in arcane/.env}
      - PUID=1000
      - PGID=1000
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - JWT_SECRET=${JWT_SECRET}
    cgroup: host
    restart: unless-stopped

networks:
  cloudflare:
    external: true

volumes:
  arcane-data:
